services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    depends_on:
      - api
